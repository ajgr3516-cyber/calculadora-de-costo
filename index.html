<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora de Costo</title>

  <!-- Librerías de Telegram y Supabase -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body style="font-family: Arial, sans-serif; margin: 0; padding: 20px;">

  <!-- Pantalla de verificación mientras valida el ID -->
  <div id="loading" style="text-align: center; margin-top: 50px;">
    <h2>Verificando licencia...</h2>
    <p style="color: gray;">Por favor espera un momento.</p>
  </div>

  <!-- Contenedor donde va el HTML de tu calculadora original -->
  <div id="app" style="display: none;">

    <!-- ======================================================= -->
    <!-- PEGA AQUÍ ABAJO EL CÓDIGO HTML Y CSS DE TU CALCULADORA ORIGINAL -->
    <!-- ======================================================= -->

    

    <!-- ======================================================= -->
  </div>

  <script>
    // Configuración con tu clave anon tradicional
    const SUPABASE_URL = "https://vjuwvihrtweeyobvhvce.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZqdXd2aWhydHdlZXlvYnZodmNlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE5NDE1NzIsImV4cCI6MjEwNzUxNzU3Mn0.0E8-2tXyCDrBVEDPU9yVDrJNpS2rLkghy0-HEXchbGo";

    const { createClient } = supabase;
    const supabaseClient = createClient(SUPABASE_URL, SUPABASE_KEY);

    async function verificarLicencia() {
      const loadingDiv = document.getElementById("loading");

      try {
        window.Telegram.WebApp.ready();
        const tgUser = window.Telegram.WebApp.initDataUnsafe?.user;

        if (!tgUser || !tgUser.id) {
          loadingDiv.innerHTML = `
            <h2 style="color: #d9534f;">⚠️ Acceso Denegado</h2>
            <p>Abre esta aplicación directamente desde Telegram.</p>
          `;
          return;
        }

        const telegramId = String(tgUser.id);

        const { data, error } = await supabaseClient
          .from('usuarios_autorizados')
          .select('telegram_id')
          .eq('telegram_id', telegramId);

        if (error) {
          loadingDiv.innerHTML = `
            <h2 style="color: #d9534f;">❌ Error de conexión</h2>
            <p>${error.message}</p>
          `;
          return;
        }

        if (data && data.length > 0) {
          loadingDiv.style.display = "none";
          document.getElementById("app").style.display = "block";
        } else {
          loadingDiv.innerHTML = `
            <h2 style="color: #d9534f;">❌ Sin Licencia Activa</h2>
            <p>Tu ID (<strong>${telegramId}</strong>) no está registrado.</p>
          `;
        }
      } catch (err) {
        loadingDiv.innerHTML = `
          <h2 style="color: #d9534f;">⚠️ Error Crítico</h2>
          <p>Ocurrió un problema al validar tu sesión.</p>
        `;
      }
    }

    document.addEventListener("DOMContentLoaded", verificarLicencia);
  </script>
</body>
</html>
