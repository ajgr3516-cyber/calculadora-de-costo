<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verificador</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body style="font-family: sans-serif; padding: 20px; text-align: center;">

  <h2 id="estado">Iniciando verificación...</h2>
  <p id="detalle" style="color: gray;"></p>

  <div id="calculadora" style="display: none; margin-top: 20px;">
    <h1 style="color: green;">¡Acceso Concedido!</h1>
    <p>Tu calculadora está cargando correctamente.</p>
  </div>

  <script>
    const SUPABASE_URL = "https://vjuwvihrtweeyobvhvce.supabase.co";
    const SUPABASE_KEY = "PEGA_AQUI_TU_PUBLISHABLE_KEY"; // Tu clave de Supabase

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    async function probarAcceso() {
      const estado = document.getElementById("estado");
      const detalle = document.getElementById("detalle");

      try {
        window.Telegram.WebApp.ready();
        const user = window.Telegram.WebApp.initDataUnsafe?.user;

        if (!user || !user.id) {
          estado.innerText = "⚠️ No se detectó usuario";
          detalle.innerText = "Abre esta app directamente desde el chat de Telegram.";
          return;
        }

        const idTelegram = String(user.id);
        detalle.innerText = "Tu ID detectado es: " + idTelegram;

        // Consultar Supabase
        const { data, error } = await supabaseClient
          .from('usuarios_autorizados')
          .select('telegram_id')
          .eq('telegram_id', idTelegram);

        if (error) {
          estado.innerText = "❌ Error en la base de datos";
          detalle.innerText = error.message;
          return;
        }

        if (data && data.length > 0) {
          estado.style.display = "none";
          detalle.style.display = "none";
          document.getElementById("calculadora").style.display = "block";
        } else {
          estado.innerText = "❌ Acceso Denegado";
          detalle.innerText = "El ID " + idTelegram + " no está registrado en Supabase.";
        }

      } catch (err) {
        estado.innerText = "❌ Error crítico";
        detalle.innerText = err.toString();
      }
    }

    probarAcceso();
  </script>
</body>
</html>
