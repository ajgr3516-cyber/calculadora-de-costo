<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora de Costos Avanzada</title>
  
  <!-- Librerías de Telegram y Supabase -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    body {
      background-color: #0b071e;
      color: #f8fafc;
      padding: 16px;
      padding-bottom: 40px;
    }

    /* Pantalla de Verificación */
    #loading {
      text-align: center;
      margin-top: 60px;
      padding: 20px;
    }
    #loading h2 {
      font-size: 18px;
      color: #38bdf8;
      margin-bottom: 8px;
    }
    #loading p {
      font-size: 14px;
      color: #94a3b8;
    }

    /* Encabezado */
    .header {
      text-align: center;
      margin-bottom: 20px;
      padding: 10px 0;
    }
    .header h1 {
      font-size: 20px;
      color: #ffffff;
      font-weight: 800;
      letter-spacing: 0.5px;
      margin-top: 6px;
    }

    /* Tarjetas y Contenedores */
    label {
      display: block;
      font-size: 13px;
      color: #cbd5e1;
      margin-top: 12px;
      margin-bottom: 6px;
    }
    
    input, select {
      width: 100%;
      padding: 11px 14px;
      border-radius: 10px;
      border: 1px solid #4c3d8a;
      background: #171036;
      color: #fff;
      font-size: 14px;
      outline: none;
      box-shadow: 0 0 8px rgba(56, 189, 248, 0.15);
    }
    input:focus, select:focus {
      border-color: #38bdf8;
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.4);
    }

    /* Sección de Materia Prima */
    .section-title {
      font-size: 16px;
      color: #f8fafc;
      font-weight: 700;
      margin-bottom: 12px;
      margin-top: 20px;
      letter-spacing: 0.5px;
    }

    .mat-item {
      display: grid;
      grid-template-columns: 2fr 1fr 1.3fr 1fr 36px;
      gap: 6px;
      align-items: center;
      margin-bottom: 10px;
    }

    .mat-labels {
      display: grid;
      grid-template-columns: 2fr 1fr 1.3fr 1fr 36px;
      gap: 6px;
      font-size: 11px;
      color: #94a3b8;
      margin-bottom: 4px;
    }

    .btn-add {
      background: #17253b;
      color: #38bdf8;
      border: 1px solid #38bdf8;
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }
    .btn-add:hover {
      background: #38bdf8;
      color: #0b071e;
    }

    .btn-del {
      background: transparent;
      color: #ef4444;
      border: none;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      text-align: center;
      height: 100%;
    }

    .row-labor {
      display: flex;
      gap: 10px;
      margin-bottom: 10px;
    }

    /* Caja de Resultados Estilo Neón */
    .result-box {
      background: linear-gradient(135deg, #130c2e, #0b071e);
      border: 2px solid #38bdf8;
      border-radius: 16px;
      padding: 20px 14px;
      text-align: center;
      margin-top: 24px;
      box-shadow: 0 0 20px rgba(56, 189, 248, 0.25);
    }

    .result-main-val {
      font-size: 32px;
      font-weight: 900;
      color: #ffffff;
      margin-bottom: 16px;
    }

    .result-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
      border-top: 1px solid rgba(56, 189, 248, 0.3);
      padding-top: 14px;
    }

    .result-item .title {
      font-size: 11px;
      color: #94a3b8;
      margin-bottom: 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    
    .result-item .val {
      font-size: 18px;
      font-weight: bold;
    }

    .val-costo { color: #f8fafc; }
    .val-ganancia { color: #f59e0b; }
    .val-precio { color: #4ade80; }
  </style>
</head>
<body>

  <!-- PANTALLA DE CARGA Y VALIDACIÓN -->
  <div id="loading">
    <h2>⏳ Verificando Licencia...</h2>
    <p>Conectando con la base de datos de autorización.</p>
  </div>

  <!-- INTERFAZ DE LA CALCULADORA -->
  <div id="app" style="display: none;">
    <div class="header">
      <h1>📊 CALCULADORA DE COSTOS AVANZADA</h1>
    </div>

    <!-- NOMBRE DEL PRODUCTO -->
    <div>
      <label>Nombre del Producto</label>
      <input type="text" id="prod-name" placeholder="">
    </div>

    <!-- GESTIÓN DE MATERIA PRIMA -->
    <div class="section-title">GESTIÓN DE MATERIA PRIMA</div>
    
    <div class="mat-labels">
      <span>Descripción del Ítem</span>
      <span>$ Costo</span>
      <span>Cantidad</span>
      <span>Unidad</span>
      <span></span>
    </div>

    <div id="materials-container">
      <!-- Fila 1 -->
      <div class="mat-item">
        <input type="text" placeholder="" class="mat-desc">
        <input type="number" step="0.01" placeholder="$" class="mat-cost" oninput="calculate()">
        <input type="number" step="0.01" value="1" class="mat-qty" oninput="calculate()">
        <select class="mat-unit" onchange="calculate()">
          <option value="Unidades">Unidades</option>
          <option value="Kg">Kg</option>
          <option value="Gr">Gr</option>
          <option value="L">L</option>
          <option value="ml">ml</option>
        </select>
        <button class="btn-del" onclick="removeRow(this)">✕</button>
      </div>

      <!-- Fila 2 -->
      <div class="mat-item">
        <input type="text" placeholder="" class="mat-desc">
        <input type="number" step="0.01" placeholder="$" class="mat-cost" oninput="calculate()">
        <input type="number" step="0.01" value="1" class="mat-qty" oninput="calculate()">
        <select class="mat-unit" onchange="calculate()">
          <option value="Unidades">Unidades</option>
          <option value="Kg">Kg</option>
          <option value="Gr">Gr</option>
          <option value="L">L</option>
          <option value="ml">ml</option>
        </select>
        <button class="btn-del" onclick="removeRow(this)">✕</button>
      </div>
    </div>

    <button class="btn-add" onclick="addMaterial()">+ Agregar Ítem</button>

    <!-- MANO DE OBRA Y GASTOS -->
    <div class="row-labor" style="margin-top: 16px;">
      <div style="flex: 1;">
        <label>Mano de Obra y Gastos ($)</label>
        <input type="number" step="0.01" id="overhead-cost" value="0.00" oninput="calculate()">
      </div>
      <div style="flex: 1;">
        <label>Margen de Ganancia (%)</label>
        <input type="number" step="1" id="profit-margin" value="50" oninput="calculate()">
      </div>
    </div>

    <!-- CAJA DE RESULTADOS ESTILO NEÓN -->
    <div class="result-box">
      <div class="result-main-val" id="res-price">$ 0.00</div>
      
      <div class="result-grid">
        <div class="result-item">
          <div class="title">Costo Total</div>
          <div class="val val-costo" id="res-cost">$0.00</div>
        </div>
        <div class="result-item">
          <div class="title">Ganancia</div>
          <div class="val val-ganancia" id="res-profit">$0.00</div>
        </div>
        <div class="result-item">
          <div class="title">Precio Venta</div>
          <div class="val val-precio" id="res-price-sub">$0.00</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Configuración de Supabase
    const SUPABASE_URL = "https://vjuwvihrtweeyobvhvce.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZqdXd2aWhydHdlZXlvYnZodmNlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE5NDE1NzIsImV4cCI6MjEwNzUxNzU3Mn0.0E8-2tXyCDrBVEDPU9yVDrJNpS2rLkghy0-HEXchbGo";

    // Validar Licencia antes de mostrar la calculadora
    async function verificarLicencia() {
      const loading = document.getElementById("loading");
      const app = document.getElementById("app");

      try {
        if (window.Telegram && window.Telegram.WebApp) {
          window.Telegram.WebApp.ready();
          window.Telegram.WebApp.expand();
        }

        const tgUser = window.Telegram?.WebApp?.initDataUnsafe?.user;

        if (!tgUser || !tgUser.id) {
          loading.innerHTML = `
            <h2 style="color: #ef4444;">⚠️ Acceso Denegado</h2>
            <p>Por favor abre esta aplicación directamente desde Telegram.</p>
          `;
          return;
        }

        const telegramId = String(tgUser.id);
        const { createClient } = supabase;
        const supabaseClient = createClient(SUPABASE_URL, SUPABASE_KEY);

        const { data, error } = await supabaseClient
          .from('usuarios_autorizados')
          .select('telegram_id')
          .eq('telegram_id', telegramId);

        if (error) {
          loading.innerHTML = `
            <h2 style="color: #ef4444;">❌ Error de Base de Datos</h2>
            <p>${error.message}</p>
          `;
          return;
        }

        if (data && data.length > 0) {
          loading.style.display = "none";
          app.style.display = "block";
          calculate();
        } else {
          loading.innerHTML = `
            <h2 style="color: #ef4444;">❌ Sin Licencia Activa</h2>
            <p>El ID <strong>${telegramId}</strong> no está autorizado.</p>
          `;
        }

      } catch (err) {
        loading.innerHTML = `
          <h2 style="color: #ef4444;">⚠️ Error Inesperado</h2>
          <p>${err.message || err.toString()}</p>
        `;
      }
    }

    function addMaterial() {
      const container = document.getElementById('materials-container');
      const div = document.createElement('div');
      div.className = 'mat-item';
      div.innerHTML = `
        <input type="text" placeholder="" class="mat-desc">
        <input type="number" step="0.01" placeholder="$" class="mat-cost" oninput="calculate()">
        <input type="number" step="0.01" value="1" class="mat-qty" oninput="calculate()">
        <select class="mat-unit" onchange="calculate()">
          <option value="Unidades">Unidades</option>
          <option value="Kg">Kg</option>
          <option value="Gr">Gr</option>
          <option value="L">L</option>
          <option value="ml">ml</option>
        </select>
        <button class="btn-del" onclick="removeRow(this)">✕</button>
      `;
      container.appendChild(div);
    }

    function removeRow(btn) {
      btn.parentElement.remove();
      calculate();
    }

    function calculate() {
      // 1. Sumar materia prima e insumos (Costo x Cantidad si aplica)
      let materialsTotal = 0;
      document.querySelectorAll('.mat-item').forEach(row => {
        const cost = parseFloat(row.querySelector('.mat-cost').value) || 0;
        const qty = parseFloat(row.querySelector('.mat-qty').value) || 1;
        materialsTotal += (cost * qty);
      });

      // 2. Mano de obra y gastos
      const overhead = parseFloat(document.getElementById('overhead-cost').value) || 0;
      
      // Costo Total
      const totalCost = materialsTotal + overhead;

      // 3. Margen de ganancia y Precio de Venta
      const marginPct = parseFloat(document.getElementById('profit-margin').value) || 0;
      const profit = totalCost * (marginPct / 100);
      const sellingPrice = totalCost + profit;

      // Renderizar resultados en la caja neón
      document.getElementById('res-cost').innerText = `$${totalCost.toFixed(2)}`;
      document.getElementById('res-profit').innerText = `$${profit.toFixed(2)}`;
      document.getElementById('res-price').innerText = `$ ${sellingPrice.toFixed(2)}`;
      document.getElementById('res-price-sub').innerText = `$${sellingPrice.toFixed(2)}`;
    }

    // Iniciar verificación al cargar
    window.addEventListener("DOMContentLoaded", verificarLicencia);
  </script>
</body>
</html>
