<!-- Cargar la librería de Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
  // Configuración de Supabase
  const SUPABASE_URL = "https://vjuwvihrtweeyobvhvce.supabase.co";
  const SUPABASE_KEY = "PEGA_AQUI_TU_CLAVE_PUBLISHABLE_COMPLETA";

  const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  async function verificarAcceso(telegramId) {
    try {
      const { data, error } = await supabase
        .from('usuarios_autorizados')
        .select('telegram_id')
        .eq('telegram_id', String(telegramId));

      if (error) {
        console.error("Error al consultar Supabase:", error);
        return false;
      }

      // Si encuentra al menos 1 registro coincidente, otorga acceso
      return data && data.length > 0;
    } catch (err) {
      console.error("Error inesperado:", err);
      return false;
    }
  }
</script>
