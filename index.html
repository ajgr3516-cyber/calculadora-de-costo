<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora de Costos Avanzada</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #0b0a19;
      color: #ffffff;
      padding: 20px;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 520px;
    }

    h1 {
      text-align: center;
      font-size: 1.4rem;
      font-weight: 800;
      letter-spacing: 0.5px;
      margin-bottom: 25px;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .section-title {
      font-size: 0.9rem;
      font-weight: 700;
      color: #e2e8f0;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 12px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-size: 0.85rem;
      color: #a0aec0;
      margin-bottom: 6px;
    }

    input, select {
      width: 100%;
      background-color: #16142e;
      border: 1px solid #2b2752;
      border-radius: 12px;
      padding: 12px 14px;
      color: #ffffff;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus, select:focus {
      border-color: #00d2ff;
    }

    /* Encabezados de la tabla */
    .item-headers {
      display: grid;
      grid-template-columns: 2.2fr 1fr 1fr 1fr 1.2fr 30px;
      gap: 6px;
      font-size: 0.72rem;
      color: #a0aec0;
      margin-bottom: 6px;
      padding: 0 4px;
    }

    .item-row {
      display: grid;
      grid-template-columns: 2.2fr 1fr 1fr 1fr 1.2fr 30px;
      gap: 6px;
      margin-bottom: 10px;
      align-items: center;
    }

    .item-row input, .item-row select {
      padding: 10px 8px;
      font-size: 0.85rem;
    }

    .item-subtotal {
      background-color: #131128;
      border: 1px solid #232044;
      border-radius: 12px;
      padding: 10px 4px;
      font-size: 0.8rem;
      color: #00d2ff;
      font-weight: bold;
      text-align: center;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .btn-remove {
      background: none;
      border: none;
      color: #ff4757;
      font-size: 1.2rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4px;
    }

    .btn-add {
      background-color: #121d3a;
      border: 1px solid #1e3a8a;
      color: #00d2ff;
      padding: 10px 16px;
      border-radius: 10px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 5px;
      margin-bottom: 25px;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 25px;
    }

    /* Tarjeta de Resumen Final */
    .results-card {
      background-color: #0f132e;
      border: 1.5px solid #00d2ff;
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 0 20px rgba(0, 210, 255, 0.15);
    }

    .main-price-box {
      text-align: center;
      margin-bottom: 20px;
      border-bottom: 1px solid #1a224d;
      padding-bottom: 16px;
    }

    .main-price-title {
      font-size: 0.8rem;
      color: #a0aec0;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 6px;
    }

    .main-price {
      font-size: 2.6rem;
      font-weight: 800;
      color: #2ed573;
    }

    /* Lista detallada final */
    .summary-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.88rem;
    }

    .summary-label {
      color: #a0aec0;
    }

    .summary-value {
      font-weight: 700;
      font-size: 1rem;
    }

    .highlight-blue { color: #00d2ff; }
    .highlight-white { color: #ffffff; }
    .highlight-yellow { color: #ffb703; }
    .highlight-green { color: #2ed573; }
  </style>
</head>
<body>

  <div class="container">
    <h1>📊 CALCULADORA DE COSTOS AVANZADA</h1>

    <!-- Nombre del Producto -->
    <div class="form-group">
      <label>Nombre del Producto</label>
      <input type="text" id="productName" placeholder="Ej: Hamburguesa Especial / Cloro">
    </div>

    <!-- Gestión de Materia Prima -->
    <div class="section-title">GESTIÓN DE MATERIA PRIMA</div>
    
    <div class="item-headers">
      <span>Materia Prima</span>
      <span>$ Costo</span>
      <span>Cantidad</span>
      <span>Unidad</span>
      <span>Total ($)</span>
      <span></span>
    </div>

    <div id="itemsContainer"></div>

    <button type="button" class="btn-add" onclick="addItem()">+ Agregar Ítem</button>

    <!-- Gastos Adicionales y Margen -->
    <div class="grid-2">
      <div class="form-group" style="margin: 0;">
        <label>Mano de Obra y Gastos ($)</label>
        <input type="number" id="laborCost" value="0.00" step="0.01" oninput="calculateTotal()">
      </div>
      <div class="form-group" style="margin: 0;">
        <label>Margen de Ganancia (%)</label>
        <input type="number" id="profitMargin" value="50" step="1" oninput="calculateTotal()">
      </div>
    </div>

    <!-- Tarjeta de Desglose Final -->
    <div class="results-card">
      <div class="main-price-box">
        <div class="main-price-title">PRECIO DE VENTA SUGERIDO</div>
        <div class="main-price" id="displaySalePrice">$ 0.00</div>
      </div>

      <div class="summary-list">
        <div class="summary-row">
          <span class="summary-label">Total en Materia Prima:</span>
          <span class="summary-value highlight-blue" id="displayRawMaterials">$0.00</span>
        </div>
        
        <div class="summary-row">
          <span class="summary-label">Mano de Obra / Gastos:</span>
          <span class="summary-value highlight-white" id="displayLabor">$0.00</span>
        </div>

        <div class="summary-row" style="border-top: 1px dashed #232044; padding-top: 10px;">
          <span class="summary-label" style="font-weight: 700; color: #ffffff;">COSTO TOTAL DEL PRODUCTO:</span>
          <span class="summary-value highlight-white" id="displayTotalCost" style="font-size: 1.1rem;">$0.00</span>
        </div>

        <div class="summary-row">
          <span class="summary-label">Ganancia a Sumar (<span id="displayMarginPercent">50</span>%):</span>
          <span class="summary-value highlight-yellow" id="displayProfit">$0.00</span>
        </div>

        <div class="summary-row" style="border-top: 1px solid #1a224d; padding-top: 12px; margin-top: 4px;">
          <span class="summary-label" style="font-weight: 800; color: #2ed573;">PRECIO TOTAL DE VENTA:</span>
          <span class="summary-value highlight-green" id="displayFinalPrice" style="font-size: 1.2rem;">$0.00</span>
        </div>
      </div>
    </div>
  </div>

  <script>
    window.onload = function() {
      addItem("Hipoclorito", 1, 20, "L");
      addItem("Agua", 1, 1, "L");
    };

    function addItem(name = "", cost = "", qty = "", unit = "L") {
      const container = document.getElementById("itemsContainer");
      const row = document.createElement("div");
      row.className = "item-row";

      row.innerHTML = `
        <input type="text" class="item-name" placeholder="Materia prima" value="${name}" oninput="calculateTotal()">
        <input type="number" class="item-cost" placeholder="0" value="${cost}" step="0.01" oninput="calculateTotal()">
        <input type="number" class="item-qty" placeholder="0" value="${qty}" step="0.01" oninput="calculateTotal()">
        <select class="item-unit" onchange="calculateTotal()">
          <option value="L" ${unit === 'L' ? 'selected' : ''}>L</option>
          <option value="Kg" ${unit === 'Kg' ? 'selected' : ''}>Kg</option>
          <option value="Gr" ${unit === 'Gr' ? 'selected' : ''}>Gr</option>
          <option value="Unid" ${unit === 'Unid' ? 'selected' : ''}>Unid</option>
        </select>
        <div class="item-subtotal">$0.00</div>
        <button type="button" class="btn-remove" onclick="removeItem(this)">✕</button>
      `;

      container.appendChild(row);
      calculateTotal();
    }

    function removeItem(btn) {
      btn.parentElement.remove();
      calculateTotal();
    }

    function calculateTotal() {
      const rows = document.querySelectorAll(".item-row");
      let rawMaterialsTotal = 0;

      rows.forEach(row => {
        const cost = parseFloat(row.querySelector(".item-cost").value) || 0;
        const qty = parseFloat(row.querySelector(".item-qty").value) || 0;
        const subtotal = cost * qty;
        
        row.querySelector(".item-subtotal").innerText = `$${subtotal.toFixed(2)}`;
        rawMaterialsTotal += subtotal;
      });

      const laborCost = parseFloat(document.getElementById("laborCost").value) || 0;
      const profitMargin = parseFloat(document.getElementById("profitMargin").value) || 0;

      // Costo Total del Producto
      const totalCost = rawMaterialsTotal + laborCost;

      // Monto de Ganancia en dólares
      const profitAmount = totalCost * (profitMargin / 100);

      // Precio Final
      const finalSalePrice = totalCost + profitAmount;

      // Actualizar Valores
      document.getElementById("displayRawMaterials").innerText = `$${rawMaterialsTotal.toFixed(2)}`;
      document.getElementById("displayLabor").innerText = `$${laborCost.toFixed(2)}`;
      document.getElementById("displayTotalCost").innerText = `$${totalCost.toFixed(2)}`;
      document.getElementById("displayMarginPercent").innerText = profitMargin;
      document.getElementById("displayProfit").innerText = `$${profitAmount.toFixed(2)}`;
      
      document.getElementById("displaySalePrice").innerText = `$ ${finalSalePrice.toFixed(2)}`;
      document.getElementById("displayFinalPrice").innerText = `$${finalSalePrice.toFixed(2)}`;
    }
  </script>
</body>
</html>
