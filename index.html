<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora de costo</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #090714;
      color: #ffffff;
      padding: 16px 12px;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 420px;
    }

    /* Encabezado con Emoji */
    .app-title {
      text-align: center;
      font-size: 1.35rem;
      font-weight: 900;
      letter-spacing: 0.5px;
      margin-top: 10px;
      margin-bottom: 24px;
      line-height: 1.2;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .section-title {
      font-size: 0.95rem;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: 0.5px;
      margin-bottom: 12px;
      text-transform: uppercase;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-size: 0.8rem;
      color: #a0aec0;
      margin-bottom: 6px;
    }

    /* Estilo idéntico a las cajas de texto de la imagen */
    input, select {
      width: 100%;
      background-color: #120e2a;
      border: 1px solid #231b4e;
      border-radius: 12px;
      padding: 12px 14px;
      color: #ffffff;
      font-size: 0.95rem;
      outline: none;
      transition: all 0.2s ease;
    }

    input:focus, select:focus {
      border-color: #00a8ff;
      box-shadow: 0 0 10px rgba(0, 168, 255, 0.3);
    }

    /* Tabla de Ítems (Materia Prima) */
    .item-headers {
      display: grid;
      grid-template-columns: 2.2fr 1fr 1fr 1.1fr 28px;
      gap: 6px;
      font-size: 0.72rem;
      color: #a0aec0;
      margin-bottom: 6px;
      padding: 0 2px;
    }

    .item-row {
      display: grid;
      grid-template-columns: 2.2fr 1fr 1fr 1.1fr 28px;
      gap: 6px;
      margin-bottom: 10px;
      align-items: center;
    }

    .item-row input, .item-row select {
      padding: 10px 8px;
      font-size: 0.88rem;
      text-align: center;
    }

    .item-row input.item-name {
      text-align: left;
      padding-left: 12px;
    }

    .btn-remove {
      background: none;
      border: none;
      color: #ff3b30;
      font-size: 1.1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2px;
    }

    /* Botón + Agregar Ítem */
    .btn-add {
      background-color: #0d1b34;
      border: 1.5px solid #00a8ff;
      color: #00a8ff;
      padding: 10px 18px;
      border-radius: 10px;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 4px;
      margin-bottom: 22px;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 22px;
    }

    /* Tarjeta Neón de Resultados (Tal cual la imagen) */
    .results-card {
      background-color: #090714;
      border: 2px solid #00a8ff;
      border-radius: 20px;
      padding: 24px 16px 18px 16px;
      box-shadow: 0 0 15px rgba(0, 168, 255, 0.2);
      text-align: center;
    }

    .main-price {
      font-size: 2.7rem;
      font-weight: 900;
      color: #ffffff;
      margin-bottom: 18px;
      letter-spacing: -0.5px;
    }

    .results-divider {
      border-top: 1px solid #1a224d;
      margin-bottom: 14px;
    }

    .results-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 4px;
    }

    .res-col {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .res-label {
      font-size: 0.65rem;
      color: #a0aec0;
      text-transform: uppercase;
      font-weight: 700;
      margin-bottom: 4px;
      letter-spacing: 0.3px;
    }

    .res-value {
      font-size: 1.15rem;
      font-weight: 900;
    }

    .val-cost { color: #ffffff; }
    .val-profit { color: #ffb703; }
    .val-sale { color: #2ed573; }
  </style>
</head>
<body>

  <div class="container">
    
    <!-- Título Principal -->
    <div class="app-title">
      📊 CALCULADORA DE COSTOS AVANZADA
    </div>

    <!-- Nombre del Producto -->
    <div class="form-group">
      <label>Nombre del Producto</label>
      <input type="text" id="productName" placeholder="Ej. Cloro 1L / Hamburguesa">
    </div>

    <!-- Sección Materia Prima -->
    <div class="section-title">GESTIÓN DE MATERIA PRIMA</div>
    
    <div class="item-headers">
      <span>Descripción del Ítem</span>
      <span>$ Costo</span>
      <span>Cantidad</span>
      <span>Unidad</span>
      <span></span>
    </div>

    <div id="itemsContainer"></div>

    <button type="button" class="btn-add" onclick="addItem()">+ Agregar Ítem</button>

    <!-- Mano de Obra y Margen -->
    <div class="grid-2">
      <div class="form-group" style="margin: 0;">
        <label>Mano de Obra y Gastos ($)</label>
        <input type="number" id="laborCost" value="0.00" step="0.01" oninput="calculateTotal()">
      </div>
      <div class="form-group" style="margin: 0;">
        <label>Margen de Ganancia (%)</label>
        <input type="number" id="profitMargin" value="50" step="1" oninput="calculateTotal()">
      </div>
    </div>

    <!-- Tarjeta de Resultados (Copia idéntica) -->
    <div class="results-card">
      <div class="main-price" id="displayMainPrice">$ 0.00</div>
      
      <div class="results-divider"></div>

      <div class="results-grid">
        <div class="res-col">
          <span class="res-label">COSTO TOTAL</span>
          <span class="res-value val-cost" id="displayCost">$0.00</span>
        </div>
        <div class="res-col">
          <span class="res-label">GANANCIA</span>
          <span class="res-value val-profit" id="displayProfit">$0.00</span>
        </div>
        <div class="res-col">
          <span class="res-label">PRECIO VENTA</span>
          <span class="res-value val-sale" id="displaySale">$0.00</span>
        </div>
      </div>
    </div>

  </div>

  <script>
    // Inicializar Telegram WebApp
    if (window.Telegram && window.Telegram.WebApp) {
      window.Telegram.WebApp.ready();
      window.Telegram.WebApp.expand();
    }

    // Cargar ítems de ejemplo idénticos a tu captura al iniciar
    window.onload = function() {
      addItem("Hipoclorito", 1, 20, "L");
      addItem("Agua", 1, 1, "L");
    };

    function addItem(name = "", cost = "", qty = "", unit = "L") {
      const container = document.getElementById("itemsContainer");
      const row = document.createElement("div");
      row.className = "item-row";

      row.innerHTML = `
        <input type="text" class="item-name" placeholder="Ítem" value="${name}" oninput="calculateTotal()">
        <input type="number" class="item-cost" placeholder="0" value="${cost}" step="0.01" oninput="calculateTotal()">
        <input type="number" class="item-qty" placeholder="0" value="${qty}" step="0.01" oninput="calculateTotal()">
        <select class="item-unit" onchange="calculateTotal()">
          <option value="L" ${unit === 'L' ? 'selected' : ''}>L</option>
          <option value="Kg" ${unit === 'Kg' ? 'selected' : ''}>Kg</option>
          <option value="Gr" ${unit === 'Gr' ? 'selected' : ''}>Gr</option>
          <option value="Unid" ${unit === 'Unid' ? 'selected' : ''}>Unid</option>
        </select>
        <button type="button" class="btn-remove" onclick="removeItem(this)">✕</button>
      `;

      container.appendChild(row);
      calculateTotal();
    }

    function removeItem(btn) {
      btn.parentElement.remove();
      calculateTotal();
    }

    function calculateTotal() {
      const rows = document.querySelectorAll(".item-row");
      let totalCost = 0;

      // 1. Calcular costo acumulado de insumos
      rows.forEach(row => {
        const cost = parseFloat(row.querySelector(".item-cost").value) || 0;
        const qty = parseFloat(row.querySelector(".item-qty").value) || 0;
        totalCost += (cost * qty);
      });

      // 2. Sumar Mano de Obra
      const laborCost = parseFloat(document.getElementById("laborCost").value) || 0;
      totalCost += laborCost;

      // 3. Aplicar Margen %
      const profitMargin = parseFloat(document.getElementById("profitMargin").value) || 0;
      const profitAmount = totalCost * (profitMargin / 100);
      const salePrice = totalCost + profitAmount;

      // 4. Reflejar valores exactos en la tarjeta
      document.getElementById("displayMainPrice").innerText = `$ ${salePrice.toFixed(2)}`;
      document.getElementById("displayCost").innerText = `$${totalCost.toFixed(2)}`;
      document.getElementById("displayProfit").innerText = `$${profitAmount.toFixed(2)}`;
      document.getElementById("displaySale").innerText = `$${salePrice.toFixed(2)}`;
    }
  </script>
</body>
</html>
