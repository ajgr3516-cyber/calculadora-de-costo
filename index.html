<!-- Selección de Métodos de Pago Ampliados -->
<div class="form-group-section">
    <h3>2. Selecciona Método de Pago</h3>
    
    <div class="payment-options" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px;">
        <label class="payment-card active">
            <input type="radio" name="payment_method" value="Pago Móvil" checked onclick="selectPayment('pago-movil')">
            <span class="payment-title">🇻🇪 Pago Móvil</span>
        </label>

        <label class="payment-card">
            <input type="radio" name="payment_method" value="Binance Pay" onclick="selectPayment('binance-pay')">
            <span class="payment-title">🟡 Binance Pay</span>
        </label>

        <label class="payment-card">
            <input type="radio" name="payment_method" value="USDT (TRC20)" onclick="selectPayment('usdt-trc20')">
            <span class="payment-title">🟢 USDT (TRC20)</span>
        </label>
    </div>

    <!-- Contenedor donde se cargan los datos de pago -->
    <div id="payment-details" class="payment-instructions" style="margin-top: 15px;">
        <!-- Carga dinámica -->
    </div>

    <div class="form-group" style="margin-top: 15px;">
        <label for="reference">Número de Referencia / ID de Transacción *</label>
        <input type="text" id="reference" required placeholder="Ej. 12345678 o Hash de la red">
    </div>
</div>
